# Temporary isolated test session; never mounts the production browser profile.
services:
  browser:
    mem_limit: 1024m
    memswap_limit: 1024m
    shm_size: 128m
  gateway:
    image: ${MIRROR_REGRESSION_IMAGE:-remote-browser-gateway:input-fix}
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      NODE_OPTIONS: --max-old-space-size=192
    ports: !override
      - 127.0.0.1:18081:3000
